<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Panel de Administrador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Panel de Administrador</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido Administrador</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Esta es la página exclusiva para usuarios con rol de administrador.
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" color="danger" (click)="logout()" class="ion-margin-top">
    Cerrar Sesión
  </ion-button>
</ion-content>
